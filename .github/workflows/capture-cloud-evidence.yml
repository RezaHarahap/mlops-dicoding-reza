name: Capture Cloud Deployment Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-cloud-evidence.yml'
      - 'monitoring/prometheus.yml'
      - 'monitoring/prometheus.single-service.yml'
      - 'Dockerfile'
      - 'start-services.sh'

jobs:
  evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for cloud model and Prometheus
        shell: bash
        run: |
          set -e
          MODEL='https://mlops-dicoding-reza-production.up.railway.app/v1/models/breast_cancer_model'
          TARGETS='https://mlops-dicoding-reza-production-992b.up.railway.app/api/v1/targets'
          for i in $(seq 1 40); do
            echo "Attempt $i"
            MODEL_BODY=$(curl -fsSL --max-time 20 "$MODEL" || true)
            TARGET_BODY=$(curl -fsSL --max-time 20 "$TARGETS" || true)
            echo "$MODEL_BODY" > /tmp/model.json
            echo "$TARGET_BODY" > /tmp/targets.json
            if echo "$MODEL_BODY" | grep -q 'AVAILABLE' && \
               echo "$TARGET_BODY" | grep -q 'mlops-dicoding-reza-production.up.railway.app' && \
               echo "$TARGET_BODY" | grep -q '"health":"up"'; then
              echo 'Cloud endpoints validated.'
              exit 0
            fi
            sleep 15
          done
          echo 'Cloud endpoints did not become reviewer-valid in time.'
          echo 'MODEL:'; cat /tmp/model.json
          echo 'TARGETS:'; cat /tmp/targets.json
          exit 1

      - name: Save API evidence
        run: |
          mkdir -p evidence/cloud
          curl -fsSL 'https://mlops-dicoding-reza-production.up.railway.app/v1/models/breast_cancer_model' | python -m json.tool > evidence/cloud/model-status.json
          curl -fsSL 'https://mlops-dicoding-reza-production-992b.up.railway.app/api/v1/targets' | python -m json.tool > evidence/cloud/prometheus-targets.json

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          playwright install --with-deps chromium

      - name: Capture real browser screenshots
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          Path('evidence/cloud').mkdir(parents=True, exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto('https://mlops-dicoding-reza-production.up.railway.app/v1/models/breast_cancer_model', wait_until='networkidle', timeout=60000)
              page.screenshot(path='evidence/cloud/reza_harahap-cloud-model-status.png', full_page=True)
              page.goto('https://mlops-dicoding-reza-production-992b.up.railway.app/targets', wait_until='networkidle', timeout=60000)
              page.screenshot(path='evidence/cloud/reza_harahap-prometheus-cloud-targets.png', full_page=True)
              browser.close()
          PY

      - name: Upload cloud evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloud-deployment-evidence
          path: evidence/cloud/
          retention-days: 30
