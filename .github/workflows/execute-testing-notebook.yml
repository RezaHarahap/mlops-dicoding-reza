name: Execute Cloud Testing Notebook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/execute-testing-notebook.yml'
      - 'reza_harahap-testing.ipynb'
      - 'data/breast_cancer.csv'

jobs:
  execute:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.15.1 pandas==1.5.3 requests==2.31.0 nbconvert==7.16.4 ipykernel==6.29.5

      - name: Execute testing notebook and preserve outputs
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute reza_harahap-testing.ipynb \
            --output reza_harahap-testing-executed.ipynb \
            --ExecutePreprocessor.timeout=300 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Validate notebook outputs
        run: |
          python - <<'PY'
          import json
          p='reza_harahap-testing-executed.ipynb'
          nb=json.load(open(p, encoding='utf-8'))
          code=[c for c in nb['cells'] if c['cell_type']=='code']
          assert code and all(c.get('execution_count') is not None for c in code)
          assert all(c.get('outputs') for c in code), 'every code cell must have output'
          text=json.dumps(nb)
          assert 'HTTP status:' in text
          assert 'AVAILABLE' in text
          assert 'mlops-dicoding-reza-production.up.railway.app' in text
          print('Executed code cells:', len(code))
          print('All code cells have outputs and real Railway response.')
          PY

      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-testing-notebook
          path: reza_harahap-testing-executed.ipynb
          retention-days: 30
