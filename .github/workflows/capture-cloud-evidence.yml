name: Capture Cloud Deployment Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-cloud-evidence.yml'

jobs:
  evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public Railway model endpoint
        run: |
          set -e
          MODEL='https://mlops-dicoding-reza-production.up.railway.app/v1/models/breast_cancer_model'
          for i in $(seq 1 20); do
            BODY=$(curl -fsSL --max-time 20 "$MODEL" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q 'AVAILABLE'; then
              mkdir -p evidence/cloud
              echo "$BODY" | python -m json.tool > evidence/cloud/model-status.json
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Run Prometheus 2.53 against public cloud model
        run: |
          docker run -d --name reviewer-prometheus \
            -p 9090:9090 \
            -v "$PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v2.53.0 \
            --config.file=/etc/prometheus/prometheus.yml
          for i in $(seq 1 20); do
            BODY=$(curl -fsSL 'http://127.0.0.1:9090/api/v1/targets' || true)
            if echo "$BODY" | grep -q 'mlops-dicoding-reza-production.up.railway.app' && echo "$BODY" | grep -q '"health":"up"'; then
              echo "$BODY" | python -m json.tool > evidence/cloud/prometheus-targets.json
              exit 0
            fi
            sleep 5
          done
          docker logs reviewer-prometheus || true
          exit 1

      - name: Install Playwright
        run: |
          python -m pip install playwright==1.55.0
          playwright install --with-deps chromium

      - name: Capture real browser screenshots
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          Path('evidence/cloud').mkdir(parents=True, exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto('https://mlops-dicoding-reza-production.up.railway.app/v1/models/breast_cancer_model', wait_until='networkidle', timeout=60000)
              page.screenshot(path='evidence/cloud/reza_harahap-cloud-model-status.png', full_page=True)
              page.goto('http://127.0.0.1:9090/targets', wait_until='networkidle', timeout=60000)
              page.wait_for_timeout(3000)
              page.screenshot(path='evidence/cloud/reza_harahap-prometheus-cloud-targets.png', full_page=True)
              # JSON API screenshot is also included as machine-readable visual evidence.
              page.goto('http://127.0.0.1:9090/api/v1/targets', wait_until='networkidle', timeout=60000)
              page.screenshot(path='evidence/cloud/reza_harahap-prometheus-cloud-targets-api.png', full_page=True)
              browser.close()
          PY

      - name: Upload cloud evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloud-deployment-evidence
          path: evidence/cloud/
          retention-days: 30
