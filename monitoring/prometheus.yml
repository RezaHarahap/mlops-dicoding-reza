global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "tf-serving-monitor"

scrape_configs:
  - job_name: "breast-cancer-model-serving-cloud"
    scrape_interval: 5s
    scheme: https
    metrics_path: /monitoring/prometheus/metrics
    static_configs:
      - targets: ["mlops-dicoding-reza-production.up.railway.app"]

  - job_name: "prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]
