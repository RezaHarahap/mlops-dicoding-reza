name: Pylint Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lightweight lint dependencies
        run: pip install pylint==3.3.8 pandas requests

      - name: Run pylint
        run: |
          pylint modules pipeline.py request_prediction.py \
            --disable=import-error,line-too-long,missing-function-docstring \
            | tee pylint-report.txt

      - name: Upload pylint report
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.txt
