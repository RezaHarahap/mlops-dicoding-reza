name: Test Railway TFX Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-railway.yml'

permissions:
  contents: read

jobs:
  test-railway:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.15.1 pandas==1.5.3 requests==2.32.3 nbconvert ipykernel

      - name: Execute Railway testing notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute reza_harahap-testing.ipynb \
            --output reza_harahap-testing-EXECUTED.ipynb \
            --ExecutePreprocessor.timeout=300

      - name: Validate deployment evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('reza_harahap-testing-EXECUTED.ipynb')
          assert path.exists(), 'Executed testing notebook missing'
          nb = json.loads(path.read_text())
          chunks = []
          for cell in nb.get('cells', []):
              for output in cell.get('outputs', []):
                  if 'text' in output:
                      text = output['text']
                      if isinstance(text, list):
                          text = ''.join(text)
                      chunks.append(text)
                  data = output.get('data', {})
                  text_plain = data.get('text/plain')
                  if text_plain:
                      if isinstance(text_plain, list):
                          text_plain = ''.join(text_plain)
                      chunks.append(text_plain)
          outputs = '\n'.join(chunks)
          print(outputs)
          assert 'Metadata check PASSED: examples / DT_STRING' in outputs
          assert 'RAILWAY PREDICTION TEST PASSED' in outputs
          assert 'HTTP status: 200' in outputs
          assert 'predictions' in outputs
          Path('railway-test-result.txt').write_text(outputs)
          print('\nALL RAILWAY TFX DEPLOYMENT CHECKS PASSED')
          PY

      - name: Upload Railway testing evidence
        uses: actions/upload-artifact@v4
        with:
          name: railway-testing-evidence
          path: |
            reza_harahap-testing-EXECUTED.ipynb
            railway-test-result.txt
          retention-days: 30
